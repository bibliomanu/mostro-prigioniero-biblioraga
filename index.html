.monsterArm{transform-box:view-box}.rightArm{transform-origin:154px 145px;animation:monsterWave 2.7s ease-in-out infinite}.leftArm{transform-origin:48px 145px;animation:monsterSmallWave 4.4s ease-in-out infinite}.monsterFrame.please .rightArm{animation-duration:1.35s}.monsterFrame.celebrating .rightArm{animation-duration:.72s}.monsterFrame.celebrating .leftArm{animation-duration:.9s}@keyframes monsterWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-23deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-26deg)}78%{transform:rotate(2deg)}}@keyframes monsterSmallWave{0%,70%,100%{transform:rotate(0)}83%{transform:rotate(12deg)}}
/* Movimenti piccoli e asincroni: i pulsanti rimangono raggiungibili al tocco. */
.findBat{transform:rotate(var(--tilt,0deg));animation:batDrift var(--flight,3.4s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);will-change:transform}.findBat:hover,.findBat:focus-visible{animation-play-state:paused;transform:rotate(var(--tilt,0deg)) scale(1.12)}.findBat.found{animation:batCaught .5s ease-in forwards;pointer-events:none}@keyframes batDrift{0%{transform:translate(-5px,3px) rotate(calc(var(--tilt,0deg) - 6deg))}50%{transform:translate(8px,-7px) rotate(calc(var(--tilt,0deg) + 5deg))}100%{transform:translate(-2px,5px) rotate(calc(var(--tilt,0deg) - 3deg))}}@keyframes batCaught{to{transform:translateY(-85px) scale(.3);opacity:0}}

/* Missione 2: tavolo da lavoro e puzzle con comandi grandi, anche da smartphone. */
.paperDesk{border:3px solid #a88764;background:radial-gradient(circle at 48% 20%,#f4e0ac33,transparent 55%),repeating-linear-gradient(105deg,#5e3b43 0 32px,#674650 33px 64px);border-radius:20px;padding:17px 12px;margin:14px 0;box-shadow:inset 0 0 0 5px #3a283d}

.quizAnswers{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.quizAnswers .btn{min-width:62px}.orderSolved{border:2px solid #9bd7b9;border-radius:12px;padding:14px;background:#23463d;color:#e8fff1;margin-top:12px}.mission2 .progressTrack span:nth-child(-n+2){background:var(--gold)}

/* Missione 3: pergamena e rune */

   h+=`<p class="missionText">La chiave è nascosta in un punto segreto della biblioteca. Parti da <strong>S</strong> e segui tutte le istruzioni senza saltarne nessuna.</p><div class="mapWrap">${grid}<div class="mapLegend">👣 = partenza · 📚 = scaffale/ostacolo</div></div><div class="routeSteps" aria-label="Istruzioni del percorso"><div class="routeStep"><b>1</b><span>Vai <strong>2 caselle a destra</strong></span></div><div class="routeStep"><b>2</b><span>Scendi di <strong>1 casella</strong></span></div><div class="routeStep"><b>3</b><span>Vai <strong>1 casella a sinistra</strong></span></div><div class="routeStep"><b>4</b><span>Scendi di <strong>2 caselle</strong></span></div><div class="routeStep"><b>5</b><span>Vai <strong>1 casella a destra</strong></span></div></div><p class="sceneCaption">Quando pensi di aver trovato la destinazione, tocca la casella finale.</p>`;
 }
 h+=`<div class="hintbox"><div id="hintContent"></div><div class="btnrow"><button class="btn ghost" data-act="hint" id="hintBtn">💡 Un indizio, per favore</button></div></div><div id="response" class="msg" role="status"></div></div>`;
 return h;
}

// Missione 5: ultima cifra e lucchetto finale.
const hints5={
 '5':['Guarda le tre parti: il fantasma deve risultare intero.','La parte con gli occhi va al centro.','Metti i frammenti nell’ordine: testa, occhi, sorriso.'],
 '8':['Ogni luna vale 3.','Sul piatto ci sono tre lune uguali.','3 + 3 + 3 = 9.'],
 '11':['Usa i quattro numeri già trovati: pipistrello, luna, ragno e zucca.','Primo ingranaggio: pipistrello × zucca. Secondo: ragno + luna.','8×3=24; 6+1=7; 24−7=17. Conserva la cifra delle unità: 7.']
};
const lockPieces=[{id:'head',icon:'👻',label:'Parte alta'},{id:'smile',icon:'〰️',label:'Sorriso'},{id:'eyes',icon:'👀',label:'Occhi'}];
const lockCorrect=['head','eyes','smile'];
function startFifth(){state.lockOrder=lockPieces.map(x=>x.id);state.lockPicked=null;state.finalAnswer=null;go('mission5')}
function missionFive(){const lvl=state.level;
 let h=`<div class="progress"><span>MISSIONE 5 DI 5</span><div class="progressTrack" aria-hidden="true"><span style="background:var(--gold)"></span><span style="background:var(--gold)"></span><span style="background:var(--gold)"></span><span style="background:var(--gold)"></span><span style="background:var(--gold)"></span></div><span>👻 ?</span></div><div class="eyebrow">Il segreto del lucchetto</div><h2>${lvl==='5'?'Ricostruisci il lucchetto':lvl==='8'?'La bilancia magica':'Il meccanismo del prigioniero'}</h2><div class="finalCage"><div class="finalMonster" aria-hidden="true">👾</div><p class="tiny">La gabbia è davanti a te. Manca soltanto l’ultima cifra.</p></div>`;
 if(lvl==='5'){
   const byId=Object.fromEntries(lockPieces.map(x=>[x.id,x]));
   h+=`<p class="missionText">Il simbolo del lucchetto si è spezzato in tre. <strong>Rimetti i frammenti nell’ordine giusto</strong>. Tocca due pezzi per scambiarli.</p><div class="fragmentGrid">${state.lockOrder.map((id,i)=>{const x=byId[id];return `<button class="lockFragment ${state.lockPicked===i?'selected':''}" data-lock-piece="${i}" aria-pressed="${state.lockPicked===i}"><span>${x.icon}</span><small>${x.label}</small></button>`}).join('')}</div><div class="btnrow"><button class="btn" data-act="check-fifth">Controlla il simbolo →</button></div>`;
 } else if(lvl==='8'){
   h+=`<p class="missionText">La bilancia è perfettamente in equilibrio. Ogni luna pesa <strong>3 unità</strong>. Quanto pesa il contenuto dell’altro piatto?</p><div class="balance"><div class="balancePan" aria-label="Tre lune">🌙 🌙 🌙</div><div class="balanceBar" aria-hidden="true">⚖</div><div class="balancePan" aria-label="Peso sconosciuto">?</div></div><div class="numberKeys finalNums">${[6,7,8,9,10].map(n=>`<button data-final-number="${n}">${n}</button>`).join('')}</div>`;
 } else {
   h+=`<p class="missionText">Il lucchetto ha due ingranaggi. Usa le quattro cifre già conquistate e segui l’iscrizione:</p><div class="gearBox"><div class="gear"><div>🦇 × 🎃<br><strong>${answers[lvl]} × ${answers4[lvl]}</strong></div></div><div class="gear"><div>🕷️ + 🌙<br><strong>${answers3[lvl]} + ${answers2[lvl]}</strong></div></div></div><div class="puzzleNotice">Moltiplica i numeri del primo ingranaggio. Somma quelli del secondo. Sottrai il secondo risultato dal primo. <strong>Conserva soltanto la cifra delle unità.</strong></div><div class="numberKeys finalNums">${[3,5,6,7,9].map(n=>`<button data-final-number="${n}">${n}</button>`).join('')}</div>`;
 }
 h+=`<div class="hintbox"><div id="hintContent"></div><div class="btnrow"><button class="btn ghost" data-act="hint" id="hintBtn">💡 Un indizio, per favore</button></div></div><div id="response" class="msg" role="status"></div>`;
 return h;
}
function startLock(){state.dials=[0,0,0,0,0];go('lock')}
function finalLock(){return `<div class="eyebrow">Il lucchetto finale</div><h2>Metti le cinque cifre nell’ordine giusto</h2><p class="sub">Hai conquistato 🦇 <strong>${answers[state.level]}</strong>, 🌙 <strong>${answers2[state.level]}</strong>, 🕷️ <strong>${answers3[state.level]}</strong>, 🎃 <strong>${answers4[state.level]}</strong> e 👻 <strong>${answers5[state.level]}</strong>.</p><div class="secretOrder"><strong>Ora guarda “L’ordine del lucchetto” sulla tua tessera.</strong><div class="tiny">Inserisci qui sotto le cinque cifre nell’ordine indicato sulla tessera.</div></div><div class="lockPanel"><div class="dials">${state.dials.map((n,i)=>`<div class="dial"><button data-dial-up="${i}" aria-label="Aumenta cifra ${i+1}">▲</button><div class="dialValue">${n}</div><button data-dial-down="${i}" aria-label="Diminuisci cifra ${i+1}">▼</button></div>`).join('')}</div><button class="btn" data-act="open-lock">🔓 Prova ad aprire</button><div id="response" class="msg" role="status"></div></div><p class="tiny" style="text-align:center">Il gioco non salva la combinazione che inserisci.</p>`}

const hints2={'5':['Trova il pezzo che deve stare in mezzo.','Il fantasma deve stare tra gli altri due disegni.','L’ordine è luna, fantasma, stella.'],'8':['Il libro con il numero più basso viene per primo.','La sequenza aumenta sempre di due.','L’ordine giusto è 2, 4, 6, 8.'],'11':['Comincia dall’ultima pagina: quale oggetto è stato usato per ultimo?','La candela viene appena prima della chiave. Lo specchio si usa dopo la chiave.','L’ordine è libro, candela, chiave, specchio, lucchetto.']};
function startSecond(){state.order=puzzleData[state.level].map(p=>p.id);state.picked=null;state.solved2=false;go('mission2')}
function changeOrder(newOrder,picked){state.order=newOrder;state.picked=picked;render();}

const hints={'5':['Guarda vicino agli scaffali e in alto nella stanza.','I pipistrelli sono tre: uno a sinistra, uno in alto a destra e uno in basso.','Tocca tutte e tre le figure 🦇 nella scena.'],'8':['Conta solo le ampolle con ENTRAMBE le caratteristiche.','Attenzione: una luna con tappo blu non vale. Una stella con tappo arancione non vale.','Le ampolle corrette sono la 1, la 4, la 6, la 8, la 10 e la 12.'],'11':['Cerca prima tutti i libri con la luna.','Tra quelli con la luna, scarta il rosso e quelli con una o tre strisce.','È il libro azzurro, secondo da sinistra nella prima riga.']};
function currentHints(){return (state.screen==='mission5'?hints5:state.screen==='mission4'?hints4:state.screen==='mission3'?hints3:state.screen==='mission2'?hints2:hints)[state.level]}
function updateHint(){let e=document.getElementById('hintContent'),b=document.getElementById('hintBtn');if(!e)return;const list=currentHints(),max=list.length;e.innerHTML=state.hint?`<strong>Indizio ${state.hint}/${max}:</strong> ${list[state.hint-1]}`:`<strong>Serve una mano?</strong> Puoi chiedermi fino a ${max===1?'un indizio':max+' indizi'}.`;b.disabled=state.hint>=max;}
function wrong(text){state.errors++;const r=document.getElementById('response');if(r)r.textContent=text;say(state.errors>1?'Ci siamo quasi! Prova a chiedermi un indizio.':'Mmm… riguardiamo bene gli indizi!');}
app.addEventListener('submit',e=>{if(e.target.id==='codeForm'){e.preventDefault();const c=document.getElementById('code').value.trim().toUpperCase();if(['MOSTRO26','GABBIA26','BUIO26','RAGNO26','LUNA26'].includes(c)){state.code=c;go('ages')}else{document.getElementById('codeMsg').textContent='Questo codice non apre la porta. Controlla quello stampato sulla tessera e riprova.';say('Ops, questo non è il codice giusto!')}}});
app.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const lvl=btn.dataset.level;if(lvl){state.level=lvl;state.found=[];state.selection=[];state.choice=null;state.order=[];state.picked=null;state.solved2=false;state.runeStage=0;state.lockOrder=[];state.lockPicked=null;state.creatureChoice=null;state.dials=[0,0,0,0,0];go('intro');return}if(state.screen==='mission2'){
 const piece=btn.dataset.piece;
 if(piece!==undefined){if(state.solved2)return;let i=Number(piece);if(state.picked===null)state.picked=i;else if(state.picked===i)state.picked=null;else{let next=state.order.slice();[next[state.picked],next[i]]=[next[i],next[state.picked]];state.order=next;state.picked=null;}render();return;}
 const answer=btn.dataset.answerSecond;
 if(answer!==undefined){if(Number(answer)===answers2[state.level]){say('Hai trovato la seconda cifra!');go('result2')}else wrong('Rileggi la domanda: quale cifra è nella posizione richiesta?');return;}
 }
 if(state.screen==='mission5'){
 const lp=btn.dataset.lockPiece;if(lp!==undefined){const i=Number(lp);if(state.lockPicked===null)state.lockPicked=i;else if(state.lockPicked===i)state.lockPicked=null;else{const next=state.lockOrder.slice();[next[state.lockPicked],next[i]]=[next[i],next[state.lockPicked]];state.lockOrder=next;state.lockPicked=null;}render();return;}
 const fn=btn.dataset.finalNumber;if(fn!==undefined){if(Number(fn)===answers5[state.level]){say('È giusto! Hai conquistato anche l’ultima cifra!');go('result5')}else wrong('Questa non è l’ultima cifra. Ricontrolla il meccanismo!');return;}
 }
 if(state.screen==='lock'){
 const up=btn.dataset.dialUp,down=btn.dataset.dialDown;if(up!==undefined||down!==undefined){const i=Number(up!==undefined?up:down),delta=up!==undefined?1:-1;state.dials[i]=(state.dials[i]+delta+10)%10;render();return;}
 }
 if(state.screen==='mission4'){
 const mapcell=btn.dataset.mapcell;if(mapcell!==undefined){state.mapChoice=mapcell;render();if(mapcell==='D3'){say('Trovata! La chiave era nascosta proprio qui. Abbiamo trovato la quarta cifra!');setTimeout(()=>{if(state.screen==='mission4'&&state.level==='11'&&state.mapChoice==='D3')go('result4')},650)}else wrong('Qui non c’è nulla. Ricontrolla il percorso partendo da S.');return;}
 const creature=btn.dataset.creature;if(creature!==undefined){const i=Number(creature);state.creatureChoice=i;render();if(i===3){say('È lei! La borsa si apre: abbiamo trovato la quarta cifra!');setTimeout(()=>{if(state.screen==='mission4'&&state.level==='8'&&state.creatureChoice===3)go('result4')},750)}else wrong('Qualcosa non torna con gli indizi… guardala meglio e riprova!');return;}
 const guard=btn.dataset.guardian;if(guard!==undefined){const i=Number(guard);state.guardianOpen=state.guardianOpen.includes(i)?state.guardianOpen.filter(x=>x!==i):[...state.guardianOpen,i];render();return;}
 const door=btn.dataset.door;if(door!==undefined){state.doorChoice=Number(door);document.querySelectorAll('[data-door]').forEach(b=>{const selected=Number(b.dataset.door)===state.doorChoice;b.classList.toggle('chosen',selected);b.setAttribute('aria-pressed',String(selected))});const submit=document.querySelector('[data-act="check-door"]');if(submit)submit.disabled=false;return;}
 }
 if(state.screen==='mission3'){
 const rn=btn.dataset.rune;if(rn!==undefined){if(rn==='✿'){state.runeStage=1;render();say('Il fiore è giusto! Ora decifra la seconda formula.')}else wrong('Questo simbolo non rappresenta la differenza. Riprova!');return;}
 const num=btn.dataset.runeNumber;if(num!==undefined){if(Number(num)===answers3[state.level]){say('La pergamena ha rivelato la terza cifra!');go('result3')}else wrong('Non ancora! Controlla i simboli sulla tessera e riprova.');return;}
 }
 const bat=btn.dataset.bat;if(bat!==undefined){const i=Number(bat);if(!state.found.includes(i)){state.found.push(i);btn.classList.add('found');const count=document.getElementById('counter');if(count)count.textContent=`🦇 ${state.found.length}/3`;say(['Uno trovato! Gli altri sono bravi a nascondersi.','Due! Ne manca soltanto uno.','Tutti e tre! È apparso il primo numero!'][state.found.length-1]);if(state.found.length===3)setTimeout(()=>go('result'),650)}return}const pot=btn.dataset.potion;if(pot!==undefined){const i=Number(pot);state.selection=state.selection.includes(i)?state.selection.filter(x=>x!==i):[...state.selection,i];btn.classList.toggle('selected',state.selection.includes(i));btn.setAttribute('aria-pressed',state.selection.includes(i));document.getElementById('response').textContent='';return}const book=btn.dataset.book;if(book!==undefined){state.choice=Number(book);document.querySelectorAll('[data-book]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.book)===state.choice);b.setAttribute('aria-pressed',String(Number(b.dataset.book)===state.choice))});document.querySelector('[data-act="check-book"]').disabled=false;document.getElementById('response').textContent='';return}
switch(btn.dataset.act){case'go-code':go('code');break;case'home':go('home');break;case'code':go('code');break;case'ages':go('ages');break;case'mission':state.found=[];state.selection=[];state.choice=null;go('mission');break;case'hint':{const list=currentHints();state.hint=Math.min(list.length,state.hint+1);updateHint();say(list[state.hint-1]);break;}
case'continue-second':startSecond();break;case'continue-third':startThird();break;case'continue-fourth':startFourth();break;case'continue-fifth':startFifth();break;case'replay-third':startThird();break;case'replay-fourth':startFourth();break;case'replay-fifth':startFifth();break;case'check-door':if(state.level==='5'&&state.doorChoice===0){say('La porta giusta! Abbiamo trovato la quarta cifra!');go('result4')}else wrong('Questa porta non si apre. Controlla tutti gli indizi e riprova!');break;case'check-fifth':if(state.lockOrder.every((id,i)=>id===lockCorrect[i])){say('Perfetto! Il simbolo è completo e rivela il numero 5!');go('result5')}else wrong('Il fantasma non è ancora completo. Scambia due frammenti e riprova!');break;case'go-lock':startLock();break;case'open-lock':if(state.dials.join('')===finalCodes[state.level]){say('Il lucchetto si apre! SONO LIBEROOOO!');go('freed')}else wrong('Il lucchetto non scatta. Controlla l’ordine dei simboli sulla tessera!');break;
case'move-left':case'move-right':if(state.screen==='mission2'&&!state.solved2&&state.picked!==null){const next=state.picked+(btn.dataset.act==='move-left'?-1:1);if(next>=0&&next<state.order.length){let order=state.order.slice();[order[state.picked],order[next]]=[order[next],order[state.picked]];changeOrder(order,next)}}break;
case'check-second':if(state.order.every((id,i)=>id===correctOrder[state.level][i])){state.solved2=true;state.picked=null;render();say('Le pagine sono al loro posto! Ma quale cifra hai scoperto?')}else wrong('Le pagine sono ancora fuori posto. Controlla gli indizi!');break;
case'finish-second':go('result2');break;
case'replay-second':startSecond();break;case'check-potions':if(state.selection.length===6&&[0,3,5,7,9,11].every(i=>state.selection.includes(i))){say('Esatto! Queste sono tutte le pozioni giuste!');go('result')}else wrong('Non ancora! Devi selezionare tutte e solo le ampolle che rispettano entrambe le condizioni.');break;case'clear-potions':state.selection=[];document.querySelectorAll('[data-potion]').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});document.getElementById('response').textContent='';break;case'check-book':if(state.choice===1){say('Hai individuato il libro dello stregone!');go('result')}else wrong('Questo libro non soddisfa tutti e tre gli indizi. Riprova!');break;case'end':go('end');break;case'replay':state.found=[];state.selection=[];state.choice=null;go('mission');break;case'reset':reset();break;}});
talk.addEventListener('click',()=>{if(!('speechSynthesis'in window)){say('La lettura vocale non è disponibile su questo dispositivo.');return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(bubble.textContent);u.lang='it-IT';u.rate=.9;window.speechSynthesis.speak(u)});
render();
</script>
</body></html>
